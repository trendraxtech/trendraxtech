<title>Baatcheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: two-pane messenger. Left: chats or contact picker. Right: conversation. One pane at a time on phones. */
:root {
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #eef1f0;
  --panel: #ffffff;
  --panel-2: #f5f7f6;
  --line: #dde3e1;
  --fg: #14201f;
  --muted: #627370;
  --accent: #0a6c74;
  --accent-fg: #ffffff;
  --bubble-me: #d3ecea;
  --bubble-them: #ffffff;
  --chat-bg: #e6ebe9;
  --badge: #e4572e;
  --online: #2f9e5b;
  --tick-read: #1b8fd6;
  --warn-bg: #fff3d6;
  --warn-fg: #6a4b00;
  --danger: #c4311f;
  --shadow: 0 1px 1px rgba(20, 32, 31, 0.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1413; --panel: #141e1d; --panel-2: #1a2726; --line: #263836; --fg: #e6efed; --muted: #8da3a0;
    --accent: #3cb5bd; --accent-fg: #06201f; --bubble-me: #14504f; --bubble-them: #1d2c2b; --chat-bg: #0f1918;
    --badge: #ee6a42; --online: #43c179; --tick-read: #52b6f2; --warn-bg: #3a2f10; --warn-fg: #f1d48a; --danger: #ff7b69;
    --shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1413; --panel: #141e1d; --panel-2: #1a2726; --line: #263836; --fg: #e6efed; --muted: #8da3a0;
  --accent: #3cb5bd; --accent-fg: #06201f; --bubble-me: #14504f; --bubble-them: #1d2c2b; --chat-bg: #0f1918;
  --badge: #ee6a42; --online: #43c179; --tick-read: #52b6f2; --warn-bg: #3a2f10; --warn-fg: #f1d48a; --danger: #ff7b69;
  --shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.4; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { flex: none; }

.app { height: 100%; display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); max-width: 1280px; margin: 0 auto; background: var(--panel); }

/* Sidebar */
.side { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); background: var(--panel); }
.view { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
.brand h1, .side-head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
.side-head h2 { font-size: 19px; }
.head-actions { display: flex; gap: 2px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--panel-2); color: var(--fg); }
.search { padding: 4px 16px 10px; }
.search input, .searchbar input, .sheet input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 10px 14px; outline-offset: 0; }
.search input::placeholder { color: var(--muted); }
.filters { display: flex; gap: 8px; padding: 0 16px 10px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.list { flex: 1; overflow-y: auto; min-height: 0; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.row:hover { background: var(--panel-2); }
.row[aria-current="true"] { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
.row.pick { grid-template-columns: 48px minmax(0, 1fr) 24px; }
.avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; overflow: hidden; font-family: var(--font-display); font-weight: 600; font-size: 19px; flex: none; background: #5b6b69; }
.avatar.sm { width: 40px; height: 40px; font-size: 16px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dotwrap { position: relative; flex: none; display: block; }
.dot { position: absolute; right: 0; bottom: 1px; width: 12px; height: 12px; border-radius: 50%; background: var(--online); border: 2px solid var(--panel); }
.row-main { min-width: 0; }
.row-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-last { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 4px; min-width: 0; }
.row-last span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-last.live { color: var(--accent); }
.row-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font-size: 12px; color: var(--muted); }
.row-meta.has-unread { color: var(--badge); }
.row-icons { display: flex; gap: 4px; align-items: center; color: var(--muted); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--badge); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.badge.muted { background: var(--muted); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.empty { padding: 28px 20px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty b { color: var(--fg); font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.empty p { margin: 0; }
.btn { background: var(--accent); color: var(--accent-fg); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.ghost { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); }
.mode-row { padding: 0 16px 8px; display: flex; gap: 8px; }
.group-bar { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
.group-bar input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 9px 12px; outline-offset: 0; }
.side-foot { padding: 8px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }

/* Conversation */
.convo { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--chat-bg); position: relative; }
.chatview { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.convo-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.back { display: none; margin-left: -8px; }
.who { min-width: 0; flex: 1; }
.who b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--muted); font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small.live { color: var(--accent); }
.banner { background: var(--warn-bg); color: var(--warn-fg); padding: 8px 16px; font-size: 13px; }
.searchbar { padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.msgs { flex: 1; overflow-y: auto; min-height: 0; padding: 16px clamp(12px, 5vw, 64px); display: flex; flex-direction: column; gap: 3px; }
.day, .newdiv, .sys { align-self: center; margin: 10px 0; padding: 4px 12px; font-size: 12px; color: var(--muted); background: var(--panel); border-radius: 999px; box-shadow: var(--shadow); text-align: center; max-width: 90%; }
.newdiv { color: var(--accent); font-weight: 600; }
.sys { margin: 4px 0; }
.msg { max-width: min(78%, 520px); padding: 7px 10px 6px; border-radius: 12px; box-shadow: var(--shadow); background: var(--bubble-them); overflow-wrap: anywhere; cursor: pointer; }
.msg.me { align-self: flex-end; background: var(--bubble-me); border-top-right-radius: 4px; }
.msg.them { align-self: flex-start; border-top-left-radius: 4px; }
.msg.first { margin-top: 6px; }
.msg.flash { outline: 2px solid var(--accent); }
.sender { font-size: 12.5px; font-weight: 600; margin-bottom: 1px; }
.text { white-space: pre-wrap; }
.text a { color: var(--accent); }
.deleted { font-style: italic; color: var(--muted); }
.fwd { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 2px; }
.quote { border-left: 3px solid var(--accent); background: rgba(127, 127, 127, 0.14); border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; font-size: 13px; }
.quote b { display: block; color: var(--accent); font-size: 12.5px; }
.quote span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); }
.photo { display: block; max-width: 100%; max-height: 320px; border-radius: 8px; margin-bottom: 4px; cursor: zoom-in; }
.reactions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.reactions button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 13px; }
.reactions button.mine { border-color: var(--accent); }
.foot { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); margin-top: 2px; }
.tick { width: 16px; height: 11px; }
.tick.read { color: var(--tick-read); }
.no-msgs { margin: auto; text-align: center; color: var(--muted); max-width: 280px; }
.replybar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
.replybar .rb-main { flex: 1; min-width: 0; border-left: 3px solid var(--accent); padding-left: 8px; font-size: 13px; }
.replybar b { display: block; color: var(--accent); }
.replybar span { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.emoji-bar { display: flex; gap: 2px; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; }
.emoji-bar button { font-size: 24px; width: 40px; height: 40px; border-radius: 8px; flex: none; }
.emoji-bar button:hover { background: var(--panel-2); }
.composer { display: flex; align-items: center; gap: 4px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer input[type="text"] { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel-2); border-radius: 22px; padding: 11px 16px; outline-offset: 0; margin: 0 4px; }
.send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: 0.45; cursor: default; }
.placeholder { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
.placeholder h2 { font-family: var(--font-display); color: var(--fg); margin: 12px 0 4px; font-size: 24px; }
.placeholder p { margin: 4px auto; max-width: 340px; }
.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: 90%; z-index: 30; }

/* Sheets */
.sheet-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--panel); width: min(480px, 100%); max-height: 82%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { margin: 8px 20px 4px; font-family: var(--font-display); font-size: 18px; }
.sheet .sub { margin: 0 20px 8px; color: var(--muted); font-size: 13px; }
.sheet .act { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 20px; }
.sheet .act:hover { background: var(--panel-2); }
.sheet .act.danger { color: var(--danger); }
.sheet .pad { padding: 8px 20px; display: flex; gap: 8px; }
.sheet .lightbox { display: block; max-width: 100%; margin: 0 auto; }
.react-row { display: flex; justify-content: space-around; padding: 8px 12px 12px; border-bottom: 1px solid var(--line); }
.react-row button { font-size: 28px; width: 46px; height: 46px; border-radius: 50%; }
.react-row button:hover { background: var(--panel-2); }
.react-row button.on { background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--accent); }
.member { display: flex; align-items: center; gap: 12px; padding: 8px 20px; }
.member .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 0 6px; }
.lite { color: var(--accent); font-size: 13px; padding: 4px 8px; }
.lite.danger { color: var(--danger); }

@media (min-width: 761px) { .sheet-back { align-items: center; } .sheet { border-radius: 16px; } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .app[data-view="list"] .convo { display: none; }
  .app[data-view="chat"] .side { display: none; }
  .back { display: grid; }
  .msg { max-width: 86%; }
}
</style>

<div class="app" id="app" data-view="list">

      <div class="side-head">
        <div class="brand">
          <div class="logo" aria-hidden="true">

          </button>
        </div>
      </div>
      <div class="search"><input id="search" type="search" placeholder="Chat dhundo" aria-label="Chat dhundo" autocomplete="off"></div>
      <div class="filters" id="filters">

        <button class="chip" data-f="unread" aria-pressed="false">Unread</button>

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h2 id="pickTitle">Naya chat</h2>
        </div>
      </div>
      <div class="search"><input id="pickSearch" type="search" placeholder="Naam se dhundo" aria-label="Naam se dhundo" autocomplete="off"></div>
      <div class="mode-row"><button class="btn ghost" id="modeBtn" type="button">Naya group</button></div>
      <div class="list" id="pickList"></div>
      <div class="group-bar" id="groupBar" hidden>
        <input id="groupName" type="text" placeholder="Group ka naam" aria-label="Group ka naam" maxlength="40">
        <button class="btn" id="groupGo" type="button" disabled>Banao</button>
      </div>
    </section>
  </aside>

  <main class="convo" id="convo">

      <div>
        <div class="logo" style="margin:0 auto;width:56px;height:56px;border-radius:16px" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H9l-4 3.5V8a3 3 0 0 1 3-3"/></svg>
        </div>

        <p id="phText">Connect ho raha hai...</p>
      </div>

          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-8a.5.5 0 0 0 0-.9L3.4 3.6a.5.5 0 0 0-.7.6L5 11l9 1-9 1-2.3 6.8a.5.5 0 0 0 .7.6z"/></svg>
        </button>

</div>

<div class="sheet-back" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app");

  var S = {
    db: null, user: null, room: null, me: null, canWrite: true,
    people: {}, chats: {}, drafts: {}, profiles: {}, online: {}, typing: {},
    receipts: {}, receiptsLoaded: {}, receiptUnsubs: {}, unread: {}, unreadKey: {},

  function queueMeta(c, last, ts) {
    S.metaQ[c.id] = (S.metaQ[c.id] || Promise.resolve()).then(function () {
      var ref = S.db.doc("chats/" + c.id);
      if (S.chats[c.id]) return ref.update({ last: last, ts: ts });

      if (c.type === "group") { body.name = c.name; body.createdBy = c.createdBy; body.admins = c.admins || [c.createdBy]; }
      return ref.set(body);

    var ts = Date.now(), body = { from: S.me.id, text: payload.text || "", ts: ts };

    if (payload.replyTo) body.replyTo = payload.replyTo;
    if (payload.fwd) body.fwd = true;
    var ref = S.db.collection("chats/" + c.id + "/messages").doc();

    queueMeta(c, { text: previewOf({ text: body.text, img: payload.img }).slice(0, 200), from: S.me.id, ts: ts }, ts);
    return p.catch(function (e) { toast(errText(e)); });

  /* photos: shrunk in the browser and stored inside the message */
  function compressImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 720 / Math.max(img.width, img.height));
        var cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
        var q = 0.65, d = cv.toDataURL("image/jpeg", q);
        while (d.length > 170000 && q > 0.3) { q -= 0.1; d = cv.toDataURL("image/jpeg", q); }
        if (d.length > 200000) rej(new Error("big")); else res(d);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("bad")); };
      img.src = url;
    });
  }

    }).catch(function () { toast("Ye photo nahi bhej sakte. Koi chhoti photo try karo."); });
  });

    S.seenBusy = true;
    var joined = (S.people[S.me.id] && S.people[S.me.id].joinedAt) || Date.now();
    S.db.doc("people/" + S.me.id).set({ joinedAt: joined, lastSeen: Date.now() }).catch(function () {}).then(function () { S.seenBusy = false; });
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { touchSeen(); setTyping(false); } else markRead();
  });
  window.addEventListener("pagehide", touchSeen);

  /* ---------- startup ---------- */
  function offline(text) {
    $("phText").textContent = text; $("newBtn").disabled = true; $("list").textContent = "";
    var e = el("div", "empty"); e.appendChild(el("b", null, "Chat chalu nahi hua")); e.appendChild(el("p", null, text)); $("list").appendChild(e);
  }

  async function init() {
    var cl = window.claude;
    if (!cl || !cl.use) { offline("Ye page Claude ke andar kholo aur sign in rakho. Tabhi asli chat chalti hai."); return; }
    var res = await Promise.all([cl.use("db"), cl.use("user"), cl.use("room")]);
    S.db = res[0]; S.user = res[1]; S.room = res[2];
    if (!S.db || !S.user) { offline("Chat ke liye sign in zaroori hai. Claude mein sign in karke page dobara kholo."); return; }
    S.me = await S.user.me();
    if (!S.me.id) { offline("Tumhari pehchaan nahi mil paayi. Sign in karke dobara kholo."); return; }
    S.canWrite = (await S.user.can("data.write")) !== false;
    ensureProfiles([S.me.id]);
    $("phText").textContent = "Koi chat chuno ya + dabakar naya chat shuru karo.";

    S.db.collection("people").onSnapshot(function (snap) {
      S.people = {}; snap.docs.forEach(function (d) { S.people[d.id] = d.data(); });
      ensureProfiles(Object.keys(S.people)); schedule();
    }, function (e) { toast(errText(e)); });
    try { var ps = await S.db.doc("people/" + S.me.id).get(); if (ps.exists) S.people[S.me.id] = ps.data(); } catch (e) { /* read-only is fine */ }
    touchSeen(); setInterval(function () { if (document.visibilityState === "visible") touchSeen(); }, 120000);

    S.db.doc("data/users/" + S.me.id + "/prefs").onSnapshot(function (s) {
      var v = s.exists ? s.data() : {};
      S.prefs = { pinned: v.pinned || {}, archived: v.archived || {}, muted: v.muted || {}, starred: v.starred || {}, hidden: v.hidden || {}, cleared: v.cleared || {} };
      schedule();
    }, function () {});

    S.db.collection("chats").where("members", "array-contains", S.me.id).onSnapshot(function (snap) {
      var next = {};
      snap.docs.forEach(function (d) {
        var v = d.data(); if (!Array.isArray(v.members)) return;
        next[d.id] = { id: d.id, type: v.type === "group" ? "group" : "dm", name: v.name || "", members: v.members, admins: v.admins || [], createdBy: v.createdBy, last: v.last || null, ts: Number(v.ts) || 0 };
        delete S.drafts[d.id];
      });
      S.chats = next;
      var ids = [];
      Object.keys(next).forEach(function (k) {
        var c = next[k]; ids = ids.concat(c.members); if (c.last) ids.push(c.last.from);
        watchReceipts(k); refreshUnread(c); syncDelivered(c);
      });
      Object.keys(S.receiptUnsubs).forEach(function (k) { if (!next[k]) { S.receiptUnsubs[k](); delete S.receiptUnsubs[k]; delete S.receiptsLoaded[k]; } });
      ensureProfiles(ids);
      if (S.activeId && !next[S.activeId] && !S.drafts[S.activeId]) closeChat();
      schedule(); markRead();
    }, function (e) { toast(errText(e)); });

    if (S.room) {
      S.room.onPeers(function (ch) {
        var on = {}, ty = {};
        ch.peers.forEach(function (p) {
          if (p.kind !== "viewer" || !p.by || p.isMe) return;
          on[p.by] = true;
          var t = p.presence && p.presence.typing;
          if (typeof t === "string") (ty[t] = ty[t] || []).push(p.by);
        });
        S.online = on; S.typing = ty; schedule();
      }, function () {});
    }
    renderList();
  }

  var loading = el("div", "empty"); loading.appendChild(el("p", null, "Connect ho raha hai..."));
  $("list").appendChild(loading);
  init().catch(function () { offline("Kuch gadbad hui. Page dobara kholo."); });
})();
</script>

</body></html>
